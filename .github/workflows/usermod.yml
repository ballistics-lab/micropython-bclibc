name: usermod

# natmod already covers x64/x86 (host/dev) and rp2040 (armv6m, stock
# firmware) -- see natmod.yml -- so this workflow only builds what natmod
# categorically can't reach at all (aarch64/armhf/mipsel: no such
# dynruntime.mk ARCH; wasm: no WASM ARCH; windows: the port disables native
# emit, so a .mpy has nothing to load into whatever ARCH it was built for),
# plus two genuine functional execution tests natmod's own build-only
# coverage doesn't provide (qemu-armv7m, rp2040-test-only).
#
# Every build step below goes through cibuildmp's own unified CLI/action
# (ballistics-lab/cibuildmp) -- the low-level `build-usermod-*` composite
# actions this workflow used to call directly are gone from every job except
# mipsel, kept there deliberately (see that job's own header). Static
# linking (LDFLAGS_EXTRA=-static, cibuildmp.toml's own [override]) is applied
# to armhf and mipsel only, and there it is load-bearing rather than
# aspirational: the arm64 runner has no armhf glibc and no
# /lib/ld-linux-armhf.so.3, and qemu-user runs mipsel with no sysroot.
# aarch64 used to link static too, on a deployability argument
# (micropython/micropython#17456) that did not survive scrutiny -- see the
# unix job's own comment.

on:
  # Same path filter as the pull_request trigger below, on any branch: this is
  # what makes a plain `git push` to a work branch run the matrix, without
  # needing a PR open or a workflow_dispatch (which needs actions: write, not
  # every actor pushing here has it). A branch that is also the head of an open
  # PR gets both runs -- the concurrency group keys on github.ref, which differs
  # between refs/heads/<branch> and refs/pull/<n>/merge, so they do not cancel
  # each other. That duplication is the deliberate cost of the trigger.
  push:
    paths:
      - "bclibc"
      - "usermod/**"
      - ".github/workflows/usermod.yml"
  pull_request:
    paths:
      - "bclibc"
      - "usermod/**"
      - ".github/workflows/usermod.yml"
  workflow_dispatch:
    inputs:
      mpy_tag:
        description: "MicroPython release tag (e.g. v1.28.0)"
        required: false
        default: "v1.28.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPY_TAG: ${{ github.event.inputs.mpy_tag || 'v1.28.0' }}
  # cibuildmp resolves/caches its own MicroPython checkout under this path
  # (CIBMP_CACHE_PATH -- src/cibuildmp/sources.py's own cache_root()), one
  # job-workspace-relative directory per run rather than the default
  # ~/.cache/cibuildmp: every job below needs to find the exact build tree
  # cibuildmp itself produced (mpy_dir/ports/<port>/build-<identifier>/...),
  # and a fixed, known root is what makes that path computable without
  # cibuildmp exposing it as an action output -- same convention a7p's own
  # mp-usermod.yml and micropython-wasm3's own usermod.yml use. No leading
  # dot: actions/upload-artifact defaults include-hidden-files to false,
  # silently excluding anything under a dot-prefixed directory.
  CIBMP_CACHE_PATH: ${{ github.workspace }}/cibmp-cache

jobs:
  # ── unix: x64/x86/aarch64/armhf, one matrix job ─────────────────────────────
  # x64/x86 duplicate ARCHes natmod.yml already builds *and* runs, which is
  # why this workflow's header calls itself the natmod-can't-reach-it half.
  # They are here anyway, deliberately: the two build modes fail in
  # genuinely different ways -- a usermod links against the port's own libc
  # and its globals live in firmware .bss, a natmod links against dynruntime
  # and carries its own -- so "x64 natmod passes" says nothing about the
  # usermod path on the same machine.
  #
  # mipsel is a separate job below -- on the same cibuildmp CLI as every row
  # here now, but needing a host-wide qemu-user binfmt handler that nothing
  # else does; see that job's own header. armhf is native here
  # (ubuntu-24.04-arm executes AArch32 on its own CPU, cibuildmp record
  # 0044), same as o-murphy/micropython-wasm3's own identical row -- which
  # has not been migrated off the composite actions yet.
  #
  # aarch64 no longer links static: it executes natively on the machine that
  # builds it and needs nothing special, and this binary is a CI artifact
  # only (release.yml only ever calls natmod.yml) -- nobody on a minimal
  # board receives it. armhf still does, because the arm64 runner itself has
  # no armhf glibc to link against dynamically at all.
  build-test-unix:
    name: build + test (unix-${{ matrix.arch_label }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_label: x64
            identifier: v1.28.0-manylinux_2_28_x86_64
            runs_on: ubuntu-latest
          - arch_label: x86
            identifier: v1.28.0-manylinux_2_28_i686
            runs_on: ubuntu-latest
          - arch_label: aarch64
            identifier: v1.28.0-manylinux_2_28_aarch64
            runs_on: ubuntu-24.04-arm
          - arch_label: armhf
            identifier: v1.28.0-manylinux_2_31_armv7l
            runs_on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build usermod (${{ matrix.identifier }})
        uses: ballistics-lab/cibuildmp@v0.6.1
        with:
          build: ${{ matrix.identifier }}

      - name: Run tests
        # `file` first so the log records what actually ran -- on armhf that
        # is a 32-bit ARM binary executing on an arm64 host with no emulator
        # in the picture, which is the whole point of this row's runner.
        run: |
          BIN="mpyhouse/${{ matrix.identifier }}/micropython-${{ matrix.identifier }}"
          file "$BIN"
          "$BIN" tests/test_bclibc.py

      - uses: actions/upload-artifact@v7
        with:
          name: tiny-bclibc-usermod-${{ matrix.arch_label }}
          path: mpyhouse/${{ matrix.identifier }}/
          if-no-files-found: error

  # ── unix: mipsel, cross-built and run under qemu-user ───────────────────────
  # Its own job rather than one more row in the matrix above: GitHub has no
  # mips runner and never will, so this is still a genuine cross-compile
  # (unlike armhf above, which is native on ubuntu-24.04-arm), and it needs
  # a qemu-user binfmt handler installed on the host that no other row does.
  #
  # On the CLI like every other row now, not the `build-usermod-unix`
  # composite action. That layer never invokes cibuildmp at all -- it is a
  # permanent legacy fallback rather than a second supported integration
  # path (cibuildmp record 0073), and this job plus the two
  # `fetch-micropython` uses in natmod.yml were the last things here still
  # reaching into it.
  #
  # The reason this job was held back -- record 0043 keeping the vendored
  # MICROPY_STANDALONE=1/deplibs static-libffi path for exactly this cell --
  # turns out to be an argument the other way: cibuildmp's own mipsel driver
  # applies that path itself, gated per-arch in its own source (which is why
  # `[override]` in cibuildmp.toml cannot turn it on or off). Verified on the
  # real artifact rather than inferred, in o-murphy/a7p's own already-migrated
  # `usermod (unix-mipsel)` job: `ELF 32-bit LSB executable, MIPS, MIPS32
  # rel2 ..., statically linked`, with the libffi deplibs step visible in its
  # build log. Static is also why nothing here needs the repaired lib/
  # sidecar (cibuildmp record 0070) that dynamically linked unix cells do.
  build-test-unix-mipsel:
    name: build + test (unix-mipsel, static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install qemu-user-static
        # What the composite action used to do for this arch, and it has to
        # be the real apt package, not docker/setup-qemu-action: the "Run
        # tests" step below execs the binary as an ordinary host process, so
        # the binfmt_misc registration has to be host-wide
        # (`update-binfmts`), not container-scoped. Same call a7p's own
        # mipsel row makes, for the same reason.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-user-static

      - name: Build usermod (${{ env.MPY_TAG }}-manylinux_2_41_mipsel)
        uses: ballistics-lab/cibuildmp@v0.6.1
        with:
          build: ${{ env.MPY_TAG }}-manylinux_2_41_mipsel

      - name: Run tests
        # No explicit qemu-mipsel-static prefix: the handler installed above
        # intercepts the binary transparently, same as upstream's own recipe.
        # `file` first so the log records what actually ran.
        #
        # cibuildmp's collected copy -- an identifier-qualified name that
        # does not depend on the port's own internal build-<identifier>/
        # layout, and the directory record 0070 made carry a binary's
        # repaired lib/ sidecar where one is needed. Every other row here
        # reads the same place now; this job was the first to, and the
        # rest followed once cibuildmp record 0079 made the collected
        # directory complete for every port.

        run: |
          BIN="mpyhouse/$MPY_TAG-manylinux_2_41_mipsel/micropython-$MPY_TAG-manylinux_2_41_mipsel"
          file "$BIN"
          "$BIN" tests/test_bclibc.py

      - uses: actions/upload-artifact@v7
        with:
          name: tiny-bclibc-usermod-mipsel
          path: mpyhouse/${{ env.MPY_TAG }}-manylinux_2_41_mipsel/
          if-no-files-found: error

  # ── ARMv7m: bare-metal QEMU Cortex-M3, build + test ─────────────────────────
  # A genuine functional execution test (real firmware.elf, run under QEMU),
  # not just a build-check -- what natmod's own armv7m ARCH coverage doesn't
  # provide, so it stays regardless of natmod-first.
  build-test-qemu-armv7m:
    name: build + test (armv7m / QEMU Cortex-M3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-system-arm
          pip install pyserial

      - name: Build usermod (v1.28.0-qemu-MPS2_AN385)
        uses: ballistics-lab/cibuildmp@v0.6.1
        with:
          build: v1.28.0-qemu-MPS2_AN385

      - name: Run tests via QEMU
        env:
          MPY_DIR: ${{ env.CIBMP_CACHE_PATH }}/micropython/${{ env.MPY_TAG }}
        run: |
          python3 usermod/ci/run_qemu.py \
            "mpyhouse/v1.28.0-qemu-MPS2_AN385/firmware-v1.28.0-qemu-MPS2_AN385.elf" \
            tests/

  # ── WebAssembly ───────────────────────────────────────────────────────────────
  build-test-wasm:
    name: build + test (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Write combined FROZEN_MANIFEST
        # usermod/manifest.py's own try/except only ever probes
        # $(PORT_DIR)/boards/manifest.py -- a no-op here, since
        # ports/webassembly has no boards/, only variants/. That silently
        # drops pyscript's real default (variants/pyscript/manifest.py):
        # asyncio (JS-scheduler backed) plus a require() list of 24
        # stdlib/utility modules. tests/test_bclibc.py never imports any of
        # them, which is why this went unnoticed before -- but the
        # .mjs/.wasm this job uploads is a real build artifact, not just a
        # test fixture. Written into usermod/ (under $GITHUB_WORKSPACE),
        # matching cibuildmp.toml's own [override."v1.28.0-wasm32"]
        # manifest= -- the unified action has no per-invocation
        # frozen_manifest input any more, only what the config says.
        # .gitignore'd, generated fresh every run.
        run: |
          cat > usermod/wasm_manifest.py <<EOF
          include("\$(PORT_DIR)/variants/pyscript/manifest.py")
          include("$GITHUB_WORKSPACE/usermod/manifest.py")
          EOF
          cat usermod/wasm_manifest.py

      - name: Build usermod (v1.28.0-wasm32)
        # VARIANT is not configurable per-identifier from here; cibuildmp's
        # own webassembly driver always builds the pyscript variant (not the
        # port's own default `standard`, which is broken against modern
        # emsdk -- micropython/micropython#19380) -- same reasoning
        # o-murphy/micropython-wasm3's own webassembly job already recorded.
        uses: ballistics-lab/cibuildmp@v0.6.1
        with:
          build: v1.28.0-wasm32

      - name: Run tests
        run: |
          node "mpyhouse/v1.28.0-wasm32/micropython-v1.28.0-wasm32.mjs" tests/test_bclibc.py

      - uses: actions/upload-artifact@v7
        with:
          name: tiny-bclibc-usermod-wasm
          path: mpyhouse/v1.28.0-wasm32/
          if-no-files-found: error

  # ── RP2040: usermod firmware, tested via the rp2040py emulator ──────────────
  # Both boards share the same RP2040 silicon, so this is one matrix rather
  # than a second copy of the job: RPI_PICO_W only adds the onboard CYW43439
  # (rp2040py's own --board pico_w gives it an emulated one, same as the
  # BOARD=RPI_PICO_W firmware expects), which tests/test_bclibc.py never
  # touches -- the point of building it here is board-firmware coverage, not
  # a second functional test of the library.
  build-test-rp2040:
    name: build + test (rp2040-${{ matrix.board_label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board_label: pico
            board: RPI_PICO
            rp2040py_board: pico
          - board_label: picow
            board: RPI_PICO_W
            rp2040py_board: pico_w
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build usermod (v1.28.0-rp2-${{ matrix.board }})
        uses: ballistics-lab/cibuildmp@v0.6.1
        with:
          build: v1.28.0-rp2-${{ matrix.board }}

      # v0.1.0b3's action.yml had a real bug (passed the *rp2040py package* version to
      # `uv tool install --python`, not an actual interpreter spec) - fixed in v0.1.0b4.
      # v0.1.0b5 fixes a second, more serious one: raw-REPL uploads over ~512 bytes (like
      # tests/test_bclibc.py below, ~13KB) used to hang the device forever - see
      # docs/PORTING.md#raw-repl-uploads-and-cross-thread-usbcdctx_fifo-access-a-real-previously-undiscovered-bug
      # in the rp2040py repo for the full story. `version` pins the installed rp2040py PyPI
      # package itself, separately from this ref.
      - uses: o-murphy/rp2040py/.github/actions/setup-rp2040py@v0.3.2
        with:
          version: "0.3.1"

      - name: Test firmware via rp2040py emulator
        # tests/test_bclibc.py isn't frozen into the firmware -- it's pushed
        # over the raw-REPL protocol from the host and run in place, same as
        # `mpremote run`. `micropython -c/-m/<file>` runs non-interactively
        # and exits with the device's own exception status (0/1), but
        # MicroPython's raw REPL swallows an uncaught SystemExit silently
        # (no traceback, no visible failure) -- confirmed against a real
        # image, not assumed -- so test_bclibc.py's own `sys.exit(N)` on
        # failure never surfaces as a nonzero rp2040py exit code. It does
        # print "N test(s) FAILED" first though, so that's what's actually
        # checked below.
        # build-<board>, not build-<identifier>: build_rp2() deliberately
        # passes no BUILD= override at all (an explicit one leaks
        # FROZEN_MANIFEST into the port's internal mpy-cross sub-build via
        # MAKEFLAGS), so the real path is the port's own unmodified
        # BOARD-keyed default.
        run: |
          set -o pipefail
          timeout 120 rp2040py micropython \
            --board ${{ matrix.rp2040py_board }} \
            --image "mpyhouse/$MPY_TAG-rp2-${{ matrix.board }}/firmware-$MPY_TAG-rp2-${{ matrix.board }}.uf2" \
            tests/test_bclibc.py 2>&1 | tee test_bclibc.log
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::rp2040py micropython exited with status $status"
            exit "$status"
          fi
          if grep -q "FAILED" test_bclibc.log; then
            echo "::error::test_bclibc reported failures"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: tiny-bclibc-usermod-rp2040-${{ matrix.board_label }}
          path: mpyhouse/${{ env.MPY_TAG }}-rp2-${{ matrix.board }}/
          if-no-files-found: error

  # ── RP2350: usermod firmware, build-only ────────────────────────────────────
  # RPI_PICO2/RPI_PICO2_W are Cortex-M33 (RP2350), not RP2040 -- rp2040py is,
  # per its own name and docs, an RP2040-only emulator (its Kaluma section
  # even notes upstream Kaluma splits `pico`/`pico2-w` builds, which is the
  # closest this tool gets to acknowledging RP2350 exists). No RP2350 CI
  # emulator exists anywhere here, so same situation as build-esp32 below:
  # this proves tiny_bclibc compiles and links into a real RPI_PICO2/
  # RPI_PICO2_W firmware, not that it runs. The Pico SDK cibuildmp's rp2
  # driver needs is vendored by the MicroPython release tarball itself
  # (same as every other rp2 board), so no separate RP2350 toolchain pin is
  # needed here.
  build-rp2350:
    name: build (rp2350-${{ matrix.board_label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board_label: pico2
            board: RPI_PICO2
          - board_label: pico2w
            board: RPI_PICO2_W
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build usermod (v1.28.0-rp2-${{ matrix.board }})
        uses: ballistics-lab/cibuildmp@v0.6.1
        with:
          build: v1.28.0-rp2-${{ matrix.board }}

      - uses: actions/upload-artifact@v7
        with:
          name: tiny-bclibc-usermod-rp2350-${{ matrix.board_label }}
          path: mpyhouse/${{ env.MPY_TAG }}-rp2-${{ matrix.board }}/
          if-no-files-found: error

  # ── Windows, build (Linux, cross-compiled) ──────────────────────────────────
  # natmod categorically cannot reach this port: ports/windows/mpconfigport.h
  # sets MICROPY_EMIT_X64 (0), and py/persistentcode.c gates .mpy native-code
  # loading on MICROPY_EMIT_MACHINE_CODE -- so a natmod .mpy has nothing to
  # load into here, whatever ARCH it was built for. usermod is the only way
  # tiny_bclibc runs on Windows at all.
  #
  # All three arches now come out of cibuildmp's own `windows` usermod driver
  # -- one Docker image, cross-compiling (x86/x64 via apt's mingw-w64 gcc,
  # arm64 via llvm-mingw), the same recipe upstream MicroPython's own
  # build-mingw job uses. No Windows runner, no MSYS2, at build time at all --
  # building and running it split into two jobs, same shape
  # o-murphy/micropython-wasm3's and o-murphy/a7p's own equivalents use.
  # llvm-mingw's own gcc-compatible arm64 driver survives
  # ports/windows/Makefile's gcc-tuned -Werror set with no override needed
  # (unlike this job's own previous MSYS2/CLANGARM64 incarnation, which
  # needed -Wno-error against MSYS2's plain clang) -- both other repos' own
  # win_arm64 rows already build this way with no such override, which is
  # the live confirmation this job leans on rather than assuming afresh.
  build-windows:
    name: build (windows-${{ matrix.arch_label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_label: x86
            identifier: v1.28.0-win32
          - arch_label: x64
            identifier: v1.28.0-win_amd64
          - arch_label: arm64
            identifier: v1.28.0-win_arm64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build usermod (${{ matrix.identifier }})
        uses: ballistics-lab/cibuildmp@v0.6.1
        with:
          build: ${{ matrix.identifier }}

      - uses: actions/upload-artifact@v7
        with:
          name: tiny-bclibc-usermod-windows-${{ matrix.arch_label }}
          path: mpyhouse/${{ matrix.identifier }}/
          if-no-files-found: error

  # ── Windows, run (real Windows hosts) ───────────────────────────────────────
  # A cross-built PE binary still needs a real Windows host to execute --
  # x86/x64 on windows-latest (a real x64 box, WOW64 covers the 32-bit case),
  # arm64 on windows-11-arm. Not an MSYS2 binary any more (build_windows()'s
  # own cross-compiled output, not linked against an MSYS2 runtime), so it
  # runs directly from PowerShell. Checkout needs submodules too, even though
  # this job builds nothing itself -- live-caught migrating
  # o-murphy/micropython-wasm3's own identical job: tests/test_bclibc.py
  # reads no submodule content directly, but a missing submodules: recursive
  # here was still the wrong default to leave unstated once one job in this
  # workflow actually needed it (this repo's own test suite is self-
  # contained, so this is defensive rather than load-bearing).
  usermod-windows-test:
    name: test (windows-${{ matrix.arch_label }})
    needs: build-windows
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      # `identifier` here only to name the downloaded file: the build job
      # uploads cibuildmp's own collected directory now, whose binary is
      # identifier-qualified (`micropython-v1.28.0-win_amd64.exe`) rather
      # than the port's bare `micropython.exe`. Same values as the build
      # matrix above, deliberately spelled out rather than derived.
      matrix:
        include:
          - arch_label: x86
            identifier: v1.28.0-win32
            runs_on: windows-latest
          - arch_label: x64
            identifier: v1.28.0-win_amd64
            runs_on: windows-latest
          - arch_label: arm64
            identifier: v1.28.0-win_arm64
            runs_on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/download-artifact@v8
        with:
          name: tiny-bclibc-usermod-windows-${{ matrix.arch_label }}
          path: build

      - name: Run tests (windows-${{ matrix.arch_label }})
        run: .\build\micropython-${{ matrix.identifier }}.exe tests\test_bclibc.py

  # ── ESP32: usermod firmware, build-only ─────────────────────────────────────
  # Build-only, and that is not a shortcut -- there is no esp32 emulator to
  # hand a firmware image to the way rp2040py takes an RP2040 .uf2 or
  # qemu-system-arm takes a Cortex-M3 .elf. What this job proves is that
  # tiny_bclibc compiles and links into a real esp32 firmware under the
  # ESP-IDF toolchain. It does not prove anything runs.
  #
  # IDF v5.5.1 because that is what ports/esp32/README.md names as the
  # current recommended version for this MicroPython release.
  # BOARD=ESP32_GENERIC: the mainstream target, matching what natmod already
  # covers as an ARCH (xtensawin).
  build-esp32:
    name: build (esp32 / ESP32_GENERIC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build usermod (v1.28.0-esp32-ESP32_GENERIC)
        uses: ballistics-lab/cibuildmp@v0.6.1
        with:
          build: v1.28.0-esp32-ESP32_GENERIC

      - uses: actions/upload-artifact@v7
        with:
          name: tiny-bclibc-usermod-esp32
          path: mpyhouse/${{ env.MPY_TAG }}-esp32-ESP32_GENERIC/
          if-no-files-found: error
