name: usermod

# natmod already covers x64/x86 (host/dev) and rp2040 (armv6m, stock
# firmware) -- see natmod.yml -- so this workflow only builds what natmod
# categorically can't reach at all (aarch64/armhf/mipsel: no such
# dynruntime.mk ARCH; wasm: no WASM ARCH), plus two genuine functional
# execution tests natmod's own build-only coverage doesn't provide
# (qemu-armv7m, rp2040-test-only).
#
# No wrapper Makefile for usermod (a7p doesn't have one for its own usermod
# either -- see usermod/micropython.mk's own header comment) -- every build
# is the direct `make -C $MPY_DIR/ports/... ...` sequence, inlined here,
# same as a7p's own usermod job in that project's micropython.yml. Static
# linking (MICROPY_STANDALONE=1 LDFLAGS_EXTRA=-static) for aarch64/armhf/
# mipsel is a deliberate real-deployability requirement, not a CI nicety --
# see micropython/micropython#17456.
#
# No Docker anywhere in this workflow: every toolchain here is a plain apt
# package (or, for wasm, a plain emsdk checkout) installable directly on
# ubuntu-latest.

on:
  pull_request:
    paths:
      - "bclibc"
      - "usermod/**"
      - ".github/workflows/usermod.yml"
  workflow_dispatch:
    inputs:
      mpy_tag:
        description: "MicroPython release tag (e.g. v1.28.0)"
        required: false
        default: "v1.28.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPY_TAG: ${{ github.event.inputs.mpy_tag || 'v1.28.0' }}

jobs:
  # ── AArch64: native, statically linked ──────────────────────────────────────
  build-test-aarch64:
    name: build + test (aarch64, static)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
          fetch-depth: 0

      - uses: ./.github/actions/fetch-micropython
        with:
          mpy_tag: ${{ env.MPY_TAG }}

      - name: Install build deps
        # autoconf/libtool/libtool-bin/libltdl-dev are for
        # MICROPY_STANDALONE=1's own autotools build of lib/libffi (its own
        # ./autogen.sh rule handles the rest -- no manual libtoolize/
        # autoreconf needed). No libffi-dev: MICROPY_STANDALONE=1 means we
        # build our own static libffi.a instead of linking the system's.
        run: sudo apt-get install -y autoconf libtool libtool-bin libltdl-dev pkg-config

      - name: Build mpy-cross
        # Built explicitly first, before FROZEN_MANIFEST ever appears on a
        # command line -- avoids py/mkenv.mk's auto-build rule for
        # mpy-cross, which resets USER_C_MODULES= for that recursive make
        # but not FROZEN_MANIFEST= (leaks through MAKEFLAGS otherwise).
        run: make -C "$MPY_DIR/mpy-cross"

      - name: Build libffi (deplibs)
        # MICROPY_STANDALONE=1 only makes libffi a DEPLIBS entry, not an
        # actual prerequisite of the default build (`deplibs:
        # $(DEPLIBS)` is its own separate Makefile target) -- must run as
        # its own step before the main build. No `submodules` step needed
        # first: MPY_DIR here is the official release tarball, which ships
        # lib/libffi's full source already vendored in (unlike a plain git
        # clone, where it's an empty submodule placeholder) -- running
        # `git submodule` against it would just fail ("not a git
        # repository").
        # BUILD must match the main build step's BUILD -- deplibs writes
        # libffi.a under $(BUILD)/lib/libffi/out/lib/, and the main build
        # looks for it there too; a mismatch is a real "ld: cannot find
        # .../libffi.a" failure (confirmed by CI).
        run: |
          BUILD="$GITHUB_WORKSPACE/usermod/build/aarch64"
          make -C "$MPY_DIR/ports/unix" BUILD="$BUILD" MICROPY_STANDALONE=1 deplibs

      - name: Build usermod (aarch64, static)
        # BUILD is a local shell var, not a job/step env: -- a job-level
        # env: BUILD would leak into the "Build mpy-cross" / "Build libffi"
        # steps above too (they run `make` in the same job), and since
        # py/mkenv.mk sets BUILD ?= build, an inherited env var wins over
        # that default, making mpy-cross (or libffi's own build) end up
        # rooted under usermod/build/aarch64 instead of its own default
        # location -- confirmed by a real CI failure ("mpy-cross not found
        # at .../mpy-cross/build/mpy-cross, please build it first" even
        # though the earlier step built it, just at the wrong path).
        run: |
          BUILD="$GITHUB_WORKSPACE/usermod/build/aarch64"
          make -C "$MPY_DIR/ports/unix" VARIANT=standard \
            BUILD="$BUILD" \
            MICROPY_STANDALONE=1 LDFLAGS_EXTRA="-static" \
            USER_C_MODULES="$GITHUB_WORKSPACE" \
            FROZEN_MANIFEST="$GITHUB_WORKSPACE/usermod/manifest.py" \
            MP_BCLIBC_PRECISION=double -j"$(nproc)"

      - name: Run tests
        run: "$GITHUB_WORKSPACE/usermod/build/aarch64/micropython tests/test_bclibc.py"

      - uses: actions/upload-artifact@v7
        with:
          name: tiny-bclibc-usermod-aarch64
          path: usermod/build/aarch64/micropython
          if-no-files-found: error

  # ── ARMhf: cross-compiled, statically linked, tested under qemu-user-static ─
  build-test-armhf:
    name: build + test (armhf, static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
          fetch-depth: 0

      - uses: ./.github/actions/fetch-micropython
        with:
          mpy_tag: ${{ env.MPY_TAG }}

      - name: Install packages
        # No /usr/gnemul sysroot symlink needed -- the binary is fully
        # static, so qemu-user-static's binfmt_misc handler runs it
        # directly with no dynamic libraries to resolve at all.
        run: |
          sudo apt-get install -y \
            gcc-arm-linux-gnueabi g++-arm-linux-gnueabi libltdl-dev \
            autoconf libtool libtool-bin pkg-config
          sudo apt-get install -y qemu-user-static
          qemu-arm-static --version

      - name: Build mpy-cross
        run: make -C "$MPY_DIR/mpy-cross"

      - name: Build libffi (deplibs)
        # Same reasoning as the aarch64 job's identical step: MPY_DIR is a
        # release tarball with lib/libffi already vendored, so no
        # `submodules` step is needed (or possible) first. BUILD must match
        # the main build step's BUILD (see that job's comment on the same
        # step for why).
        run: |
          BUILD="$GITHUB_WORKSPACE/usermod/build/armhf"
          make -C "$MPY_DIR/ports/unix" VARIANT=standard \
            BUILD="$BUILD" \
            CROSS_COMPILE=arm-linux-gnueabi- \
            MICROPY_STANDALONE=1 deplibs

      - name: Build usermod (armhf, static)
        # BUILD is a local shell var, not a job env: -- see the aarch64
        # job's identical step for why (leaks into mpy-cross/deplibs steps
        # otherwise, via py/mkenv.mk's BUILD ?= build).
        run: |
          BUILD="$GITHUB_WORKSPACE/usermod/build/armhf"
          make -C "$MPY_DIR/ports/unix" VARIANT=standard \
            BUILD="$BUILD" \
            CROSS_COMPILE=arm-linux-gnueabi- \
            MICROPY_STANDALONE=1 LDFLAGS_EXTRA="-static" \
            USER_C_MODULES="$GITHUB_WORKSPACE" \
            FROZEN_MANIFEST="$GITHUB_WORKSPACE/usermod/manifest.py" \
            MP_BCLIBC_PRECISION=double -j"$(nproc)"

      - name: Run tests
        run: "$GITHUB_WORKSPACE/usermod/build/armhf/micropython tests/test_bclibc.py"

      - uses: actions/upload-artifact@v7
        with:
          name: tiny-bclibc-usermod-armhf
          path: usermod/build/armhf/micropython
          if-no-files-found: error

  # ── MIPS LE: cross-compiled, statically linked, tested under qemu-user-static
  build-test-mipsel:
    name: build + test (mipsel, static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
          fetch-depth: 0

      - uses: ./.github/actions/fetch-micropython
        with:
          mpy_tag: ${{ env.MPY_TAG }}

      - name: Install packages
        run: |
          sudo apt-get install -y \
            gcc-mipsel-linux-gnu g++-mipsel-linux-gnu libc6-mipsel-cross libltdl-dev \
            autoconf libtool libtool-bin pkg-config
          sudo apt-get install -y qemu-user-static
          qemu-mipsel-static --version

      - name: Build mpy-cross
        run: make -C "$MPY_DIR/mpy-cross"

      - name: Build libffi (deplibs)
        # BUILD must match the main build step's BUILD (see the aarch64
        # job's comment on the same step for why).
        run: |
          BUILD="$GITHUB_WORKSPACE/usermod/build/mipsel"
          make -C "$MPY_DIR/ports/unix" VARIANT=standard \
            BUILD="$BUILD" \
            CROSS_COMPILE=mipsel-linux-gnu- \
            MICROPY_STANDALONE=1 deplibs

      - name: Build usermod (mipsel, static)
        # BUILD is a local shell var, not a job env: -- see the aarch64
        # job's identical step for why (leaks into mpy-cross/deplibs steps
        # otherwise, via py/mkenv.mk's BUILD ?= build).
        run: |
          BUILD="$GITHUB_WORKSPACE/usermod/build/mipsel"
          make -C "$MPY_DIR/ports/unix" VARIANT=standard \
            BUILD="$BUILD" \
            CROSS_COMPILE=mipsel-linux-gnu- \
            MICROPY_STANDALONE=1 LDFLAGS_EXTRA="-static" \
            USER_C_MODULES="$GITHUB_WORKSPACE" \
            FROZEN_MANIFEST="$GITHUB_WORKSPACE/usermod/manifest.py" \
            MP_BCLIBC_PRECISION=double -j"$(nproc)"

      - name: Run tests
        run: "$GITHUB_WORKSPACE/usermod/build/mipsel/micropython tests/test_bclibc.py"

      - uses: actions/upload-artifact@v7
        with:
          name: tiny-bclibc-usermod-mipsel
          path: usermod/build/mipsel/micropython
          if-no-files-found: error

  # ── ARMv7m: bare-metal QEMU Cortex-M3, build + test ─────────────────────────
  # A genuine functional execution test (real firmware.elf, run under QEMU),
  # not just a build-check -- what natmod's own armv7m ARCH coverage doesn't
  # provide, so it stays regardless of natmod-first. No FPU on Cortex-M3,
  # hence single precision.
  build-test-qemu-armv7m:
    name: build + test (armv7m / QEMU Cortex-M3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
          fetch-depth: 0

      - uses: ./.github/actions/fetch-micropython
        with:
          mpy_tag: ${{ env.MPY_TAG }}

      - name: Install toolchain + QEMU
        run: |
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm
          pip install pyserial

      - name: Build mpy-cross
        run: make -C "$MPY_DIR/mpy-cross"

      - name: Build MicroPython QEMU firmware (MPS2_AN385 / Cortex-M3)
        run: |
          make -C "$MPY_DIR/ports/qemu" BOARD=MPS2_AN385 \
            USER_C_MODULES="$GITHUB_WORKSPACE" \
            FROZEN_MANIFEST="$GITHUB_WORKSPACE/usermod/manifest.py" \
            MP_BCLIBC_PRECISION=single

      - name: Run tests via QEMU
        run: |
          python3 usermod/ci/run_qemu.py \
            "$MPY_DIR/ports/qemu/build-MPS2_AN385/firmware.elf" \
            tests/

  # ── WebAssembly ───────────────────────────────────────────────────────────────
  # JS/browser numbers are double-precision natively -- no size/speed
  # benefit to single precision here, so double only.
  build-test-wasm:
    name: build + test (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
          fetch-depth: 0

      - uses: ./.github/actions/clone-micropython
        with:
          mpy_tag: ${{ env.MPY_TAG }}
          submodules: lib/micropython-lib

      - name: Install emsdk
        # Same recipe as natmod.yml/a7p's own webassembly job -- "latest"
        # is what upstream itself pins to for this port.
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          (cd emsdk && ./emsdk install latest && ./emsdk activate latest)

      - name: Build mpy-cross
        run: make -C "$MPY_DIR/mpy-cross"

      - name: Build + test (wasm)
        # BUILD is a local shell var, not a job env: -- see the aarch64
        # job's identical reasoning (leaks into the "Build mpy-cross" step
        # above otherwise, via py/mkenv.mk's BUILD ?= build).
        #
        # VARIANT=pyscript, not the default `standard` variant: the
        # `standard` variant (-s ASYNCIFY) is broken against modern emsdk
        # in multiple ways -- confirmed by a real CI failure here
        # (-Werror on -Wunused-but-set-global in main.c's
        # external_call_depth) and tracked upstream at
        # micropython/micropython#19380 (filed against this exact
        # combination: v1.28.0 + emsdk latest). A CFLAGS/CC override to
        # silence just the warning was tried first and didn't actually
        # take effect for reasons not fully understood; moot anyway, since
        # upstream's own maintainer recommendation there is "use the
        # pyscript variant" (it doesn't use ASYNCIFY at all) -- same
        # variant a7p's own webassembly job already uses, which is why
        # a7p never hit this. Our own FROZEN_MANIFEST overrides pyscript's
        # default manifest.py (a large micropython-lib require() list we
        # don't need) -- that's fine, VARIANT only changes the build
        # config (JSFLAGS, no ASYNCIFY), the manifest default is separate
        # and command-line FROZEN_MANIFEST= wins over it either way.
        run: |
          BUILD="$GITHUB_WORKSPACE/usermod/build/wasm"
          source emsdk/emsdk_env.sh
          make -C "$MPY_DIR/ports/webassembly" VARIANT=pyscript \
            BUILD="$BUILD" \
            USER_C_MODULES="$GITHUB_WORKSPACE" \
            FROZEN_MANIFEST="$GITHUB_WORKSPACE/usermod/manifest.py" \
            MP_BCLIBC_PRECISION=double
          node "$BUILD/micropython.mjs" tests/test_bclibc.py

      - uses: actions/upload-artifact@v7
        with:
          name: tiny-bclibc-usermod-wasm
          path: |
            usermod/build/wasm/micropython.mjs
            usermod/build/wasm/micropython.wasm
          if-no-files-found: error

  # ── RP2040: frozen-tests firmware, tested via rp2040js emulator ─────────────
  # A genuine functional execution test, distinct from the plain rp2040
  # firmware build natmod's own armv6m coverage already makes redundant.
  # CMake port -- USER_C_MODULES points at usermod/micropython.cmake
  # directly, not the repo root (CMake's USER_C_MODULES takes a file, not a
  # directory to glob).
  build-test-rp2040:
    name: build + test (rp2040)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
          fetch-depth: 0

      - uses: ./.github/actions/clone-micropython
        with:
          mpy_tag: ${{ env.MPY_TAG }}
          # lib/mbedtls: ports/rp2/CMakeLists.txt unconditionally lists it
          # in GIT_SUBMODULES (needed even without wifi/BT) -- omitting it
          # here fails CMake configure with "Cannot find source file:
          # .../lib/mbedtls/library/aes.c" (a real CI failure).
          submodules: lib/pico-sdk lib/micropython-lib lib/tinyusb lib/mbedtls
          pico_sdk_submodules: 'true'

      - name: Install toolchain
        run: |
          sudo apt-get install -y \
            cmake \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            python3

      - name: Build mpy-cross
        run: make -C "$MPY_DIR/mpy-cross"

      - name: Build RP2040 test firmware (frozen tests, single precision)
        # BUILD is a local shell var, not a job env: -- see the aarch64
        # job's identical reasoning (leaks into the "Build mpy-cross" step
        # above otherwise, via py/mkenv.mk's BUILD ?= build).
        run: |
          BUILD="$GITHUB_WORKSPACE/usermod/build/rp2040_test"
          make -C "$MPY_DIR/ports/rp2" \
            BUILD="$BUILD" \
            BOARD=RPI_PICO \
            USER_C_MODULES="$GITHUB_WORKSPACE/usermod/micropython.cmake" \
            FROZEN_MANIFEST="$GITHUB_WORKSPACE/usermod/manifest_test.py"

      - name: Get node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Get and patch rp2040js emulator
        run: |
          git clone https://github.com/wokwi/rp2040js
          cd rp2040js
          npm install
          cp ../usermod/ci/micropython-run.ts demo/micropython-run.ts

      - name: Test firmware via rp2040js emulator
        working-directory: rp2040js
        run: |
          npx tsx demo/micropython-run.ts \
            --image "$GITHUB_WORKSPACE/usermod/build/rp2040_test/firmware.uf2" \
            --exec "import test_bclibc" \
            --timeout 120

      - uses: actions/upload-artifact@v7
        with:
          name: tiny-bclibc-usermod-rp2040-test
          path: usermod/build/rp2040_test/firmware.uf2
          if-no-files-found: error
