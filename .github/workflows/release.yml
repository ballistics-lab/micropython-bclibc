name: release

# Builds every natmod arch (by calling natmod.yml as a reusable workflow --
# see its own workflow_call trigger -- instead of keeping a second copy of
# that matrix in sync by hand), then publishes a GitHub release for the
# pushed tag with one *.native.mpy asset per arch plus a package.json that
# `mpremote mip install` / `mip.install()` can point at directly. Uses the
# per-entry native code compatibility tag schema proposed upstream:
#   https://github.com/micropython/micropython/pull/19532
#   https://github.com/micropython/micropython-lib/pull/1144
# See tools/build_release_assets.py for how the assets and package.json are
# assembled -- it reads each file's own compat tag directly from its .mpy
# header, so it takes the built files as plain positional arguments.
#
# One extra asset pair rides along outside that main manifest: RP2350's own
# armv7emsp/softfp build (tiny_bclibc.rp2350.mpy + package.rp2350.json) --
# see natmod/Makefile's own RP2350 override comment for why it can't be a
# second entry in package.json (the .mpy format has no room to tag it, and
# mip couldn't choose between two entries sharing one arch tag anyway).
# RP2350 users install it with mip pointed directly at that manifest's own
# release URL, e.g.:
#   mpremote mip install https://github.com/<owner>/<repo>/releases/download/<tag>/package.rp2350.json

on:
  push:
    tags:
      - "v*"

concurrency:
  # Literal "release-" prefix, not ${{ github.workflow }} -- kept consistent
  # with natmod.yml's own group (see its comment): avoids the same class of
  # caller/callee collision if this workflow ever gets called from another
  # one too.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/natmod.yml

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: tiny-bclibc-*
          path: artifacts

      - name: Assemble release assets + package.json
        # No --repo: package.json's urls are bare filenames, resolved by mip
        # relative to wherever it fetched package.json from. Every asset in a
        # GitHub release (package.json included) lives under the same
        # .../releases/download/<tag>/ path, so this stays correct across
        # forks/renames without needing to know the repo at all.
        run: |
          python3 tools/build_release_assets.py \
            --tag "${{ github.ref_name }}" \
            --out-dir release_assets \
            artifacts/*/*/tiny_bclibc.mpy

      - uses: actions/download-artifact@v8
        with:
          # Exact name, not the "tiny-bclibc-*" pattern above -- see
          # natmod.yml's own comment on this artifact's name for why it has
          # to stay out of that glob (same arch=armv7emsp tag as the plain
          # build, would trip build_release_assets.py's duplicate-arch guard
          # if fed through the same call above).
          name: natmod-armv7emsp-rp2350
          path: artifacts-rp2350

      - name: Assemble RP2350 armv7emsp/softfp variant into its own manifest
        # Same script, its own manifest file: mip can't pick between two
        # entries sharing one arch tag, so this variant isn't in the main
        # package.json at all (see natmod/Makefile's RP2350 comment for the
        # underlying .mpy-format reason). RP2350 users point mip straight at
        # this file's own release URL instead of the default package.json.
        run: |
          python3 tools/build_release_assets.py \
            --tag "${{ github.ref_name }}" \
            --out-dir release_assets \
            --asset-name tiny_bclibc.rp2350.mpy \
            --manifest-name package.rp2350.json \
            artifacts-rp2350/*/tiny_bclibc.mpy

      - uses: actions/upload-artifact@v7
        with:
          name: tiny-bclibc-release-${{ github.ref_name }}
          path: release_assets/
          if-no-files-found: error

      - name: Extract release metadata
        id: meta
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION=${{ steps.meta.outputs.version }}
          BODY=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{found=0} found" CHANGELOG.md | sed '/^[[:space:]]*$/d' | head -50)
          if [ -z "$BODY" ]; then
            BODY="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          fi
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: release_assets/*
