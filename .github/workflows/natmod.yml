name: natmod

on:
  pull_request:
    paths:
      - "bclibc"
      - "natmod/**"
      - ".github/workflows/natmod.yml"
  workflow_dispatch:
    inputs:
      mpy_tag:
        description: "MicroPython release tag (e.g. v1.28.0)"
        required: false
        default: "v1.28.0"
  # Lets release.yml build every natmod arch by calling this workflow
  # instead of keeping a second copy of the matrix below in sync by hand.
  workflow_call:
    inputs:
      mpy_tag:
        description: "MicroPython release tag (e.g. v1.28.0)"
        required: false
        type: string
        default: "v1.28.0"

concurrency:
  # Literal "natmod-" prefix, not ${{ github.workflow }} -- when this workflow
  # runs as a reusable workflow_call (from release.yml), github.workflow
  # resolves to the CALLER's name ("release"), not this file's own. With the
  # dynamic form, that collided with release.yml's own concurrency group
  # (same "release-<ref>" string) and release.yml's cancel-in-progress: false
  # meant this workflow_call could never even start (0 jobs, immediate
  # failure) -- confirmed by a real run of release.yml.
  group: natmod-${{ github.ref }}
  cancel-in-progress: true

env:
  MPY_TAG: ${{ inputs.mpy_tag || github.event.inputs.mpy_tag || 'v1.28.0' }}

jobs:
  # ── Build every arch, one precision each (derived from ARCH's own FPU in
  # natmod/Makefile -- no more separate sp/dp matrix legs; see that file's
  # header for why) ───────────────────────────────────────────────────────────
  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
          - arch: x86
            apt: gcc-multilib
          - arch: armv6m
            apt: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - arch: armv7m
            apt: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - arch: armv7emsp
            apt: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - arch: armv7emdp
            apt: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - arch: rv32imc
            apt: gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
          - arch: rv64imc
            apt: gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
          # xtensa/xtensawin need a toolchain tarball / esp-idf, not a plain
          # apt package -- handled by their own steps below, not the generic
          # "Install cross-compiler" step every other entry uses.
          - arch: xtensa
            toolchain: xtensa-lx106
          - arch: xtensawin
            toolchain: esp-idf

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/fetch-micropython
        with:
          mpy_tag: ${{ env.MPY_TAG }}

      - name: Install cross-compiler
        if: matrix.apt != ''
        run: sudo apt-get install -y ${{ matrix.apt }}

      - name: Install xtensa (esp8266) toolchain
        if: matrix.toolchain == 'xtensa-lx106'
        # Same recipe as a7p's own natmod job (and MicroPython's own
        # ci_esp8266_setup) -- there's no apt package for this target.
        run: |
          wget -q https://micropython.org/resources/xtensa-lx106-elf-standalone.tar.gz
          tar xzf xtensa-lx106-elf-standalone.tar.gz
          echo "$PWD/xtensa-lx106-elf/bin" >> "$GITHUB_PATH"

      - name: Install esp-idf (xtensawin toolchain)
        if: matrix.toolchain == 'esp-idf'
        # Same recipe as a7p's own natmod job (and MicroPython's own
        # ci_esp32_idf_setup).
        env:
          IDF_VER: v5.4
        run: |
          git clone --depth 1 --branch $IDF_VER https://github.com/espressif/esp-idf.git
          git -C esp-idf submodule update --init --recursive --filter=tree:0
          ./esp-idf/install.sh
          source esp-idf/export.sh
          echo "$PATH" | tr ':' '\n' | grep -i esp-idf >> "$GITHUB_PATH" || true

      - name: Install Python tools
        run: pip install pyelftools ar

      - name: Build mpy-cross
        run: make -C "$MPY_DIR/mpy-cross"

      - name: Build ${{ matrix.arch }}
        working-directory: natmod
        # esp-idf's export.sh puts its own python venv ahead of system
        # PATH, which resolves to a *different* python3/pip than the one
        # "Install Python tools" installed pyelftools/ar into -- mpy_ld.py
        # then fails with "RuntimeError: Please run 'pip install ar' to
        # link .a files" even though that pip install already ran
        # (confirmed by a real CI failure specific to xtensawin, the only
        # esp-idf-toolchain leg; plain xtensa/tarball-toolchain legs never
        # source export.sh, so they don't hit this).
        run: |
          if [ "${{ matrix.toolchain }}" = "esp-idf" ]; then
            source ../esp-idf/export.sh
            pip install pyelftools ar
          fi
          make ARCH=${{ matrix.arch }} MPY_DIR="$MPY_DIR" dist

      - uses: actions/upload-artifact@v7
        with:
          name: tiny-bclibc-${{ matrix.arch }}
          path: natmod/build/${{ matrix.arch }}*/
          if-no-files-found: error

  # ── Test built artifacts (x64 native, x86 32-bit, armv7m via QEMU) ────────
  # One matrix job instead of three near-identical ones -- each leg only
  # differs in toolchain/build-deps and how the interpreter gets built
  # (plain unix, 32-bit unix, or QEMU firmware), same `if: matrix.X` style
  # the build job above already uses. Mirrors a7p's own natmod job, which
  # folds its (single, x64-only) test step into the build matrix the same
  # way rather than a separate job.
  test:
    name: test (${{ matrix.label }})
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            build_dir: x64_dp
            kind: unix
            label: x64 / micropython
          - arch: x86
            build_dir: x86_dp
            kind: unix32
            label: x86 / micropython 32-bit
          - arch: armv7m
            build_dir: armv7m_sp
            kind: qemu
            label: armv7m / QEMU Cortex-M3
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/fetch-micropython
        with:
          mpy_tag: ${{ env.MPY_TAG }}

      - name: Install micropython unix build deps
        if: matrix.kind == 'unix'
        run: sudo apt-get install -y libffi-dev pkg-config

      - name: Install 32-bit build deps
        if: matrix.kind == 'unix32'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y gcc-multilib libffi-dev:i386 pkg-config

      - name: Install QEMU toolchain
        if: matrix.kind == 'qemu'
        run: |
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm
          pip install pyelftools ar pyserial

      - name: Build micropython unix/standard (matches natmod .mpy version)
        if: matrix.kind == 'unix'
        run: make -C "$MPY_DIR/ports/unix" VARIANT=standard

      - name: Build micropython unix/standard 32-bit
        if: matrix.kind == 'unix32'
        run: make -C "$MPY_DIR/ports/unix" VARIANT=standard MICROPY_FORCE_32BIT=1

      - name: Build mpy-cross
        if: matrix.kind == 'qemu'
        run: make -C "$MPY_DIR/mpy-cross"

      - name: Build MicroPython QEMU firmware (MPS2_AN385 / Cortex-M3)
        if: matrix.kind == 'qemu'
        run: make -C "$MPY_DIR/ports/qemu" BOARD=MPS2_AN385

      - uses: actions/download-artifact@v8
        with:
          name: tiny-bclibc-${{ matrix.arch }}
          path: natmod/build/

      - name: Symlink module for testing
        run: ln -sf ../natmod/build/${{ matrix.build_dir }}/tiny_bclibc.mpy tests/tiny_bclibc.mpy

      - name: Run tests
        if: matrix.kind != 'qemu'
        run: "$MPY_DIR/ports/unix/build-standard/micropython tests/test_bclibc.py"

      - name: Run tests via QEMU
        if: matrix.kind == 'qemu'
        run: |
          python3 natmod/ci/run_qemu.py \
            "$MPY_DIR/ports/qemu/build-MPS2_AN385/firmware.elf" \
            tests/

  # ── armv6m (RP2040): runtime test via the rp2040py emulator ────────────────
  # Not possible via QEMU (the MICROBIT board firmware doesn't support loading
  # native .mpy for Cortex-M0, and no other QEMU ARM board emulates armv6m
  # native modules) - the `test` job's QEMU leg above only covers armv7m. A
  # real RP2040 emulator sidesteps that entirely.
  #
  # Unlike usermod.yml's rp2040 job, the natmod .mpy here can't be pushed
  # straight over the raw-REPL protocol the way a plain .py source file can -
  # it's compiled bytecode, not text - so it has to be loaded from a mounted
  # littlefs filesystem instead, same as on real hardware. Only
  # tests/test_bclibc.py (still plain source) goes over raw-REPL.
  # mklittlefs's first file always becomes main.py, so a throwaway
  # placeholder eats that slot; its content doesn't matter because
  # MicroPythonDevice always interrupts an in-progress main.py auto-run
  # before running anything pushed over raw-REPL (confirmed against a real
  # image - the placeholder still gets a harmless one-liner rather than
  # relying on that timing).
  test-armv6m:
    name: test (armv6m / rp2040py)
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/download-artifact@v8
        with:
          name: tiny-bclibc-armv6m
          path: natmod/build/

      # See usermod.yml's rp2040 job for the action.yml --python fix in v0.1.0b4. This job also
      # specifically needs v0.1.0b4's second fix: v0.1.0b3's `mklittlefs` aborts (SIGABRT) under
      # PyPy after writing the image, because littlefs-python's C objects get finalized out of
      # order during PyPy's interpreter shutdown - not reproducible under CPython (see rp2040py's
      # docs/PORTING.md for the full writeup).
      - uses: o-murphy/rp2040py/.github/actions/setup-rp2040py@v0.1.0b4
        with:
          version: "0.1.0b4"

      - name: Build littlefs image (natmod .mpy only - tests go over raw-REPL)
        run: |
          echo "# placeholder, interrupted before it can run" > _mklittlefs_placeholder.py
          rp2040py mklittlefs littlefs.img \
            _mklittlefs_placeholder.py \
            natmod/build/armv6m_sp/tiny_bclibc.mpy

      - name: Run tests via rp2040py emulator
        # See usermod.yml's rp2040 job for why "FAILED" is grepped from the
        # output instead of relying on rp2040py's own exit code: MicroPython's
        # raw REPL silently swallows an uncaught SystemExit (test_bclibc.py's
        # own failure signal), with no traceback and no nonzero exit code.
        #
        # --image "$MPY_TAG" must resolve to the *same* firmware build the
        # .mpy above was compiled against (bytecode/mpy-cross ABI has to
        # match) - rp2040py resolves known tags to the right dated
        # micropython.org filename itself (mp_retrieve.py), but only for
        # tags already in its table. Bumping this workflow's default mpy_tag
        # ahead of a corresponding rp2040py release fails loudly here
        # ("Could not find micropython image") rather than silently, but
        # still needs rp2040py's own table updated to actually pass again.
        run: |
          set -o pipefail
          timeout 120 rp2040py micropython \
            --image "${{ env.MPY_TAG }}" \
            --littlefs littlefs.img \
            tests/test_bclibc.py 2>&1 | tee test_bclibc.log
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::rp2040py micropython exited with status $status"
            exit "$status"
          fi
          if grep -q "FAILED" test_bclibc.log; then
            echo "::error::test_bclibc reported failures"
            exit 1
          fi

  # xtensa/xtensawin (esp8266/esp32): same situation as armv6m above -- the
  # build job verifies the .mpy links cleanly, but there's no QEMU-equivalent
  # execution test for these in this workflow (matches a7p's own natmod job,
  # which also only build-checks these ARCHes, not runs them).

  # aarch64: dynruntime.mk in MicroPython ≤ v1.28 explicitly does not support
  # aarch64 as a native module link target. No job for it here until
  # upstream adds support -- it's covered today via usermod.yml instead
  # (usermod has no such ARCH restriction: it compiles straight into the
  # port's own build, not through dynruntime.mk).
