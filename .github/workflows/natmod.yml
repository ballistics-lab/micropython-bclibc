name: natmod

on:
  # Same path filter as the pull_request trigger below, on any branch: this is
  # what makes a plain `git push` to a work branch run the matrix, without
  # needing a PR open or a workflow_dispatch (which needs actions: write, not
  # every actor pushing here has it). A branch that is also the head of an open
  # PR gets both runs -- the concurrency group keys on github.ref, which differs
  # between refs/heads/<branch> and refs/pull/<n>/merge, so they do not cancel
  # each other. That duplication is the deliberate cost of the trigger.
  push:
    paths:
      - "bclibc"
      - "natmod/**"
      - ".github/workflows/natmod.yml"
  pull_request:
    paths:
      - "bclibc"
      - "natmod/**"
      - ".github/workflows/natmod.yml"
  workflow_dispatch:
    inputs:
      mpy_tag:
        description: "MicroPython release tag (e.g. v1.28.0)"
        required: false
        default: "v1.28.0"
  # Lets release.yml build every natmod arch by calling this workflow
  # instead of keeping a second copy of the matrix below in sync by hand.
  workflow_call:
    inputs:
      mpy_tag:
        description: "MicroPython release tag (e.g. v1.28.0)"
        required: false
        type: string
        default: "v1.28.0"

concurrency:
  # Literal "natmod-" prefix, not ${{ github.workflow }} -- when this workflow
  # runs as a reusable workflow_call (from release.yml), github.workflow
  # resolves to the CALLER's name ("release"), not this file's own. With the
  # dynamic form, that collided with release.yml's own concurrency group
  # (same "release-<ref>" string) and release.yml's cancel-in-progress: false
  # meant this workflow_call could never even start (0 jobs, immediate
  # failure) -- confirmed by a real run of release.yml.
  group: natmod-${{ github.ref }}
  cancel-in-progress: true

env:
  MPY_TAG: ${{ inputs.mpy_tag || github.event.inputs.mpy_tag || 'v1.28.0' }}

jobs:
  # ── Build every arch, always single-precision now (no more per-ARCH
  # double-precision variant, no more sp/dp matrix legs or build_dir suffix;
  # see natmod/Makefile's own "Precision" header for why) ───────────────────
  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Toolchain dispatch per ARCH (apt package / xtensa-lx106 tarball /
        # xtensa-esp-elf) now lives inside cibuildmp itself -- host first,
        # then a pinned download (cibuildmp's own docs/BACKLOG.md D3/M2) --
        # so this is still just the flat list of dynruntime.mk ARCHes to
        # build.
        arch: [x64, x86, armv6m, armv7m, armv7emsp, armv7emdp, rv32imc, rv64imc, xtensa, xtensawin]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # x86 is the one arch cibuildmp cannot self-provision (its own
      # docs/BACKLOG.md M2): it is the host gcc's own -m32 mode, not a
      # cross-compile, so no downloadable tarball can supply the missing
      # 32-bit glibc headers/libs the way it does for every other arch here.
      # Same package the old build-natmod action installed for this ARCH.
      - if: matrix.arch == 'x86'
        run: sudo apt-get update -q && sudo apt-get install -y gcc-multilib

      - uses: ballistics-lab/cibuildmp@v0.4.2
        with:
          # mpy*-<tag>-<arch>: cibuildmp resolves the current .mpy ABI from
          # the checked-out MicroPython itself, so this stays correct even
          # if MPY_TAG moves to a tag with a different ABI, with nothing
          # here to keep in sync by hand.
          build: mpy*-${{ env.MPY_TAG }}-${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: tiny-bclibc-${{ matrix.arch }}
          path: natmod/build/${{ matrix.arch }}*/
          if-no-files-found: error

  # ── Test built artifacts (x64 native, x86 32-bit, armv7m via QEMU) ────────
  # One matrix job instead of three near-identical ones -- each leg only
  # differs in toolchain/build-deps and how the interpreter gets built
  # (plain unix, 32-bit unix, or QEMU firmware), same `if: matrix.X` style
  # the build job above already uses. Mirrors a7p's own natmod job, which
  # folds its (single, x64-only) test step into the build matrix the same
  # way rather than a separate job.
  test:
    name: test (${{ matrix.label }})
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            build_dir: x64
            kind: unix
            label: x64 / micropython
          - arch: x86
            build_dir: x86
            kind: unix32
            label: x86 / micropython 32-bit
          - arch: armv7m
            build_dir: armv7m
            kind: qemu
            label: armv7m / QEMU Cortex-M3
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fetch MicroPython ${{ env.MPY_TAG }}
        # A plain tarball fetch, not cibuildmp's own `fetch-micropython`
        # composite action. That whole `.github/actions/*` layer never
        # invokes the cibuildmp CLI at all -- it is a permanent legacy
        # fallback, not a second supported way to use the project
        # (cibuildmp record 0073) -- and what this one did is the five
        # lines below, verbatim.
        #
        # No cibuildmp step runs in this job at all (it consumes the build
        # job's artifact), so there is no cibuildmp-resolved checkout under
        # $CIBMP_CACHE_PATH to point at the way usermod.yml's own jobs do.
        #
        # The release tarball rather than a git clone, deliberately: it
        # already carries every port's vendored lib/ sources, which is why
        # no step below runs `make submodules`.
        run: |
          VER="${MPY_TAG#v}"
          wget -q "https://github.com/micropython/micropython/releases/download/$MPY_TAG/micropython-$VER.tar.xz" \
            -O mpy.tar.xz
          tar xf mpy.tar.xz && rm mpy.tar.xz
          echo "MPY_DIR=$GITHUB_WORKSPACE/micropython-$VER" >> "$GITHUB_ENV"

      - name: Install micropython unix build deps
        if: matrix.kind == 'unix'
        # apt-get update first -- see the build job's "Install cross-compiler"
        # step for why (stale baked-in runner package index, confirmed by
        # repeated real CI 404s, not a one-off mirror blip).
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libffi-dev pkg-config

      - name: Install 32-bit build deps
        if: matrix.kind == 'unix32'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y gcc-multilib libffi-dev:i386 pkg-config

      - name: Install QEMU toolchain
        if: matrix.kind == 'qemu'
        # apt-get update first -- see the build job's "Install cross-compiler"
        # step for why (stale baked-in runner package index, confirmed by
        # repeated real CI 404s, not a one-off mirror blip).
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm
          pip install pyelftools ar pyserial

      - name: Build micropython unix/standard (matches natmod .mpy version)
        if: matrix.kind == 'unix'
        run: make -C "$MPY_DIR/ports/unix" VARIANT=standard

      - name: Build micropython unix/standard 32-bit
        if: matrix.kind == 'unix32'
        run: make -C "$MPY_DIR/ports/unix" VARIANT=standard MICROPY_FORCE_32BIT=1

      - name: Build mpy-cross
        if: matrix.kind == 'qemu'
        run: make -C "$MPY_DIR/mpy-cross"

      - name: Build MicroPython QEMU firmware (MPS2_AN385 / Cortex-M3)
        if: matrix.kind == 'qemu'
        run: make -C "$MPY_DIR/ports/qemu" BOARD=MPS2_AN385

      - uses: actions/download-artifact@v8
        with:
          name: tiny-bclibc-${{ matrix.arch }}
          path: natmod/build/

      - name: Symlink module for testing
        run: ln -sf ../natmod/build/${{ matrix.build_dir }}/tiny_bclibc.mpy tests/tiny_bclibc.mpy

      - name: Run tests
        if: matrix.kind != 'qemu'
        run: "$MPY_DIR/ports/unix/build-standard/micropython tests/test_bclibc.py"

      - name: Run tests via QEMU
        if: matrix.kind == 'qemu'
        run: |
          python3 natmod/ci/run_qemu.py \
            "$MPY_DIR/ports/qemu/build-MPS2_AN385/firmware.elf" \
            tests/

  # ── ARM natmods executed on real ARM silicon (32-bit ARM Linux) ───────────
  # The `test` job above runs armv7m under qemu-system-arm and the job below
  # runs armv6m under the rp2040py emulator. Both are emulators. This one is
  # not: ubuntu-24.04-arm executes AArch32 on its own CPU (measured -- see
  # usermod.yml's build-test-unix-static header), so a 32-bit armhf build of
  # ports/unix is a real ARM host that can load a Cortex-M natmod .mpy.
  #
  # That this works at all is not obvious, and it is not universal. Two things
  # have to line up, and py/dynruntime.mk decides both per ARCH:
  #
  #   1. The .mpy arch check. py/persistentcode.h gives a Thumb-2 host with a
  #      double-precision FPU MPY_FEATURE_ARCH = MP_NATIVE_ARCH_ARMV7EMDP, and
  #      MPY_FEATURE_ARCH_TEST is a *range* -- ARMV6M <= x <= that -- not an
  #      equality. Ubuntu's arm-linux-gnueabihf-gcc defaults to Thumb-2 with
  #      __ARM_FP=12, so every ARM natmod ARCH passes this check. Confirmed by
  #      reading it back off the built binary: sys.implementation._mpy >> 10
  #      is 8, i.e. ARMV7EMDP.
  #
  #   2. The float ABI, which the arch check does *not* cover. armv6m and
  #      armv7m are built soft-float (dynruntime.mk gives them no
  #      -mfloat-abi=hard), so floats cross into the runtime in core
  #      registers, while an armhf host expects them in VFP registers per
  #      AAPCS-VFP. The .mpy loads and then returns nonsense -- measured, not
  #      predicted: find_zero_angle came back 984.252 rad, which is the range
  #      in feet, instead of 0.002502. Silently wrong, never a crash. So those
  #      two ARCHes are deliberately absent from this matrix and keep their
  #      QEMU/rp2040py legs, which run them on the target they are actually
  #      built for.
  #
  # armv7emsp and armv7emdp are both -mfloat-abi=hard, so they do line up --
  # each against a host built with its own MICROPY_FLOAT_IMPL, since that
  # governs the size of mp_float_t on both sides of the dynruntime call
  # boundary. Both legs were run locally before this job existed: the full
  # suite passes, with find_zero_angle back at 0.002502 rad.
  #
  # Scope, stated plainly: this runs Cortex-M code inside a Linux process. It
  # proves the native module and its relocations are correct on real ARM
  # silicon; it does not replace the QEMU and rp2040py legs, which exercise
  # the firmware environment (no OS, the port's own libc, real flash layout).
  test-arm-linux:
    name: test (${{ matrix.arch }} / 32-bit ARM Linux)
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armv7emsp
            build_dir: armv7emsp
            # dynruntime.mk gives armv7emsp MICROPY_FLOAT_IMPL=float; the unix
            # port defaults to double. mpconfigvariant_common.h guards it with
            # #ifndef, so a -D on the command line wins. Verified on the
            # resulting binary rather than assumed: `print(1/3)` gives
            # 0.33333334, not 0.3333333333333333.
            host_float: "-DMICROPY_FLOAT_IMPL=MICROPY_FLOAT_IMPL_FLOAT"
          - arch: armv7emdp
            build_dir: armv7emdp
            # armv7emdp is MICROPY_FLOAT_IMPL=double, which is already the
            # unix port's own default -- nothing to override.
            host_float: ""
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fetch MicroPython ${{ env.MPY_TAG }}
        # Same plain tarball fetch as the `test` job above, for the same
        # reasons -- see that step's own comment.
        run: |
          VER="${MPY_TAG#v}"
          wget -q "https://github.com/micropython/micropython/releases/download/$MPY_TAG/micropython-$VER.tar.xz" \
            -O mpy.tar.xz
          tar xf mpy.tar.xz && rm mpy.tar.xz
          echo "MPY_DIR=$GITHUB_WORKSPACE/micropython-$VER" >> "$GITHUB_ENV"

      - name: Install the armhf cross toolchain
        # apt-get update first -- see the build job's "Install cross-compiler"
        # step for why.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

      - name: Build mpy-cross
        # Native arm64 host tool. Built explicitly so py/mkenv.mk's auto-build
        # rule never fires mid-port-build, same as every other job here.
        run: make -C "$MPY_DIR/mpy-cross" -j"$(nproc)"

      - name: Build a 32-bit ARM micropython host
        # MICROPY_PY_FFI=0/MICROPY_PY_BTREE=0: both want target libraries the
        # cross toolchain does not ship (libffi headers for armhf in
        # particular), and neither is reachable from tests/test_bclibc.py --
        # this host exists only to load a natmod .mpy and run that one suite.
        # usermod.yml's own armhf row is where a full-featured static armhf
        # build is actually exercised.
        #
        # LDFLAGS_EXTRA=-static is load-bearing, not a nicety. The runner is
        # arm64: its CPU executes AArch32, but its filesystem has no armhf
        # glibc and no /lib/ld-linux-armhf.so.3, so a dynamically linked
        # armhf binary dies with "cannot execute: required file not found"
        # (exit 127) -- a real failure of the first version of this job. A
        # static link has no interpreter to find. Same reason usermod.yml's
        # armhf row links static.
        #
        # BUILD stays outside natmod/build/, which the artifact download below
        # unpacks into.
        run: |
          make -C "$MPY_DIR/ports/unix" VARIANT=standard \
            BUILD="$GITHUB_WORKSPACE/mpy-host-${{ matrix.arch }}" \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            MICROPY_PY_FFI=0 MICROPY_PY_BTREE=0 \
            CFLAGS_EXTRA="${{ matrix.host_float }}" \
            LDFLAGS_EXTRA="-static" -j"$(nproc)"

      - uses: actions/download-artifact@v8
        with:
          name: tiny-bclibc-${{ matrix.arch }}
          path: natmod/build/

      - name: Symlink module for testing
        run: ln -sf ../natmod/build/${{ matrix.build_dir }}/tiny_bclibc.mpy tests/tiny_bclibc.mpy

      - name: Run tests
        # `file` and the two probes first, so the log carries the evidence
        # rather than this job's comment having to be taken on faith: a
        # 32-bit ARM binary, the arch it advertises to the .mpy loader, and
        # which float width it was built with.
        run: |
          HOST="$GITHUB_WORKSPACE/mpy-host-${{ matrix.arch }}/micropython"
          file "$HOST"
          "$HOST" -c "import sys; print('MPY_FEATURE_ARCH', sys.implementation._mpy >> 10)"
          "$HOST" -c "print('float width probe', 1/3)"
          "$HOST" tests/test_bclibc.py

  # ── armv6m (RP2040): runtime test via the rp2040py emulator ────────────────
  # Not possible via QEMU (the MICROBIT board firmware doesn't support loading
  # native .mpy for Cortex-M0, and no other QEMU ARM board emulates armv6m
  # native modules) - the `test` job's QEMU leg above only covers armv7m. A
  # real RP2040 emulator sidesteps that entirely.
  #
  # Unlike usermod.yml's rp2040 job, the natmod .mpy here can't be pushed
  # straight over the raw-REPL protocol the way a plain .py source file can -
  # it's compiled bytecode, not text - so it has to be loaded from a mounted
  # littlefs filesystem instead, same as on real hardware. Only
  # tests/test_bclibc.py (still plain source) goes over raw-REPL.
  # mklittlefs's first file always becomes main.py, so a throwaway
  # placeholder eats that slot; its content doesn't matter because
  # MicroPythonDevice always interrupts an in-progress main.py auto-run
  # before running anything pushed over raw-REPL (confirmed against a real
  # image - the placeholder still gets a harmless one-liner rather than
  # relying on that timing).
  test-armv6m:
    name: test (armv6m / rp2040py)
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/download-artifact@v8
        with:
          name: tiny-bclibc-armv6m
          path: natmod/build/

      # See usermod.yml's rp2040 job for the action.yml --python fix in v0.1.0b4 and the raw-REPL
      # upload-hang fix in v0.1.0b5 (the latter matters here too: tests/test_bclibc.py still goes
      # over raw-REPL below, only the .mpy itself is littlefs-loaded). This job also specifically
      # needed v0.1.0b4's other fix: v0.1.0b3's `mklittlefs` aborts (SIGABRT) under PyPy after
      # writing the image, because littlefs-python's C objects get finalized out of order during
      # PyPy's interpreter shutdown - not reproducible under CPython (see rp2040py's docs/PORTING.md
      # for the full writeup).
      #
      # v0.2.5 is the hard floor for *this* job: `mklittlefs`'s file argument only accepted
      # .py/.js before it, so handing it tiny_bclibc.mpy below died with "File must have one
      # of the following extensions: .py, .js" (exit 2) - a real failure seen on this branch
      # while it was still pinned to v0.2.4.
      - uses: o-murphy/rp2040py/.github/actions/setup-rp2040py@v0.3.1
        with:
          version: "0.3.1"

      - name: Build littlefs image (natmod .mpy only - tests go over raw-REPL)
        run: |
          echo "# placeholder, interrupted before it can run" > _mklittlefs_placeholder.py
          rp2040py mklittlefs -o littlefs.img \
            _mklittlefs_placeholder.py \
            natmod/build/armv6m/tiny_bclibc.mpy

      - name: Run tests via rp2040py emulator
        # See usermod.yml's rp2040 job for why "FAILED" is grepped from the
        # output instead of relying on rp2040py's own exit code: MicroPython's
        # raw REPL silently swallows an uncaught SystemExit (test_bclibc.py's
        # own failure signal), with no traceback and no nonzero exit code.
        #
        # --image "$MPY_TAG" must resolve to the *same* firmware build the
        # .mpy above was compiled against (bytecode/mpy-cross ABI has to
        # match) - rp2040py resolves known tags to the right dated
        # micropython.org filename itself (mp_retrieve.py), but only for
        # tags already in its table. Bumping this workflow's default mpy_tag
        # ahead of a corresponding rp2040py release fails loudly here
        # ("Could not find micropython image") rather than silently, but
        # still needs rp2040py's own table updated to actually pass again.
        run: |
          set -o pipefail
          timeout 120 rp2040py micropython \
            --image "${{ env.MPY_TAG }}" \
            --littlefs littlefs.img \
            tests/test_bclibc.py 2>&1 | tee test_bclibc.log
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::rp2040py micropython exited with status $status"
            exit "$status"
          fi
          if grep -q "FAILED" test_bclibc.log; then
            echo "::error::test_bclibc reported failures"
            exit 1
          fi

  # xtensa/xtensawin (esp8266/esp32): same situation as armv6m above -- the
  # build job verifies the .mpy links cleanly, but there's no QEMU-equivalent
  # execution test for these in this workflow (matches a7p's own natmod job,
  # which also only build-checks these ARCHes, not runs them).

  # aarch64: dynruntime.mk in MicroPython ≤ v1.28 explicitly does not support
  # aarch64 as a native module link target. No job for it here until
  # upstream adds support -- it's covered today via usermod.yml instead
  # (usermod has no such ARCH restriction: it compiles straight into the
  # port's own build, not through dynruntime.mk).
